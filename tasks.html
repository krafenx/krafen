<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krafen — Задания BP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/krafenx/krafen/8c5ff5d6ae7d406899fbf4906d5bc543e06c6648/cherry-blossom.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: rgba(20, 20, 20, 0.6);
            --accent: #5b2333;
            --accent-light: #f7f4f3;
            --accent-dark: #5b2333;
            --accent-gradient: linear-gradient(135deg, var(--accent-light), var(--accent-dark));
            --accent-soft: linear-gradient(135deg, rgba(247, 244, 243, 0.12), rgba(91, 35, 51, 0.28));
            --border: rgba(255, 255, 255, 0.05);
        }
        body {
            background-color: var(--bg);
            font-family: 'JetBrains Mono', monospace;
            color: #efefef;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .glass {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }
        .glass:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }
        .task-card {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .task-card:hover {
            border-color: var(--accent);
            background: rgba(91, 35, 51, 0.05);
        }
        .task-card.active {
            border-color: rgba(91, 35, 51, 0.8);
            background: rgba(91, 35, 51, 0.15);
            box-shadow: 0 0 20px rgba(91, 35, 51, 0.15);
        }
        /* Кастомный чекбокс в стиле сайта */
        .custom-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.375rem;
            outline: none;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }
        .custom-checkbox:checked {
            background: linear-gradient(135deg, #f7f4f3, #5b2333);
            border-color: transparent;
        }
        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: #050505;
            font-size: 0.75rem;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* Кнопки переключателей верхнего бара */
        .toggle-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }
        .toggle-btn.active[data-type="vip"] {
            background: rgba(247, 244, 243, 0.1);
            border-color: rgba(247, 244, 243, 0.4);
            color: #fff;
        }
        .toggle-btn.active[data-type="x2"] {
            background: rgba(91, 35, 51, 0.3);
            border-color: #5b2333;
            color: #ffcbd1;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #5b2333, #a13d56);
            box-shadow: 0 0 10px rgba(161, 61, 86, 0.5);
            transition: width 0.3s ease;
        }
        .top-nav {
            width: calc(100vw - 3rem);
            max-width: 72rem;
            margin: 0 auto 1.4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        @media (min-width: 768px) { .top-nav { width: calc(100vw - 6rem); } }
    </style>
</head>
<body class="p-6 md:p-12">

    <nav class="top-nav" aria-label="site sections">
        <a class="text-[10px] text-white/30 uppercase tracking-widest hover:text-white/70 transition" href="/">&larr; Главная</a>
        <div class="flex gap-2">
            <button id="btn-vip" data-type="vip" class="toggle-btn text-[10px] uppercase tracking-widest px-4 py-2 rounded-full font-bold">Platinum VIP</button>
            <button id="btn-x2" data-type="x2" class="toggle-btn text-[10px] uppercase tracking-widest px-4 py-2 rounded-full font-bold">Акция X2</button>
            <button id="btn-reset" class="text-[10px] text-white/30 uppercase tracking-widest px-4 py-2 rounded-full border border-white/5 hover:border-white/20 hover:text-white/80 transition">Сбросить всё</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto space-y-6">
        
        <div class="text-left mb-4">
            <p class="text-[10px] uppercase tracking-[0.2em] opacity-30">Калькулятор прогресса</p>
            <h1 class="text-3xl font-bold tracking-tighter text-white uppercase">Выполнение заданий BP</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            
            <div class="glass col-span-12 md:col-span-5 p-6 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-[10px] uppercase tracking-widest opacity-40">Онлайн</span>
                    <span class="text-[10px] text-white/60 font-bold">+ <span id="online-bp-counter">0</span> BP</span>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button id="online-minus" class="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-lg hover:bg-white/10 active:scale-95 transition">-</button>
                        <span id="online-hours" class="text-2xl font-bold text-white tracking-tight">0ч</span>
                        <button id="online-plus" class="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-lg hover:bg-white/10 active:scale-95 transition">+</button>
                    </div>
                    <div class="text-right">
                        <div class="text-[28px] font-bold text-white tracking-tight"><span id="online-current-bp">0</span> <span class="text-sm text-white/40">BP</span></div>
                    </div>
                </div>
            </div>

            <div class="glass col-span-12 sm:col-span-6 md:col-span-3 p-6 flex flex-col justify-between">
                <div class="text-[10px] uppercase tracking-widest opacity-40 mb-2">Набрано</div>
                <div>
                    <div class="text-3xl font-bold text-white tracking-tight"><span id="stat-earned">0</span> <span class="text-lg font-normal opacity-50">BP</span></div>
                    <div class="text-[9px] opacity-30 uppercase tracking-wider mt-1">за всё отмеченное</div>
                </div>
            </div>

            <div class="glass col-span-12 sm:col-span-6 md:col-span-4 p-6 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] uppercase tracking-widest opacity-40">Осталось</span>
                    <span id="stat-percent" class="text-[10px] opacity-50">0%</span>
                </div>
                <div>
                    <div class="text-3xl font-bold text-white tracking-tight mb-3"><span id="stat-left">0</span> <span class="text-lg font-normal opacity-50">BP</span></div>
                    <div class="w-full h-2 bg-white/5 rounded-full overflow-hidden border border-white/5">
                        <div id="progress-fill" class="progress-bar-fill h-full w-0"></div>
                    </div>
                </div>
            </div>

            <div class="glass col-span-12 p-4 px-6 flex items-center justify-between">
                <div class="text-[10px] uppercase tracking-widest opacity-40">Выполнено заданий</div>
                <div class="text-xl font-bold text-white"><span id="stat-tasks-count">0</span> <span class="text-xs opacity-30 font-normal">из 60</span></div>
            </div>

        </div>

        <div class="text-left pt-4">
            <h2 class="text-xs font-bold uppercase opacity-30 tracking-[0.2em] mb-4">Доступные задания</h2>
            <div id="tasks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
        </div>

    </main>

    <script>
        // Исходная база квестов со стандартными значениями BP (без множителей)
        const TASKS_DATA = [
            { id: 1, name: "Купить лотерейный билет", baseBp: 1 },
            { id: 2, name: "Посетить любой сайт в браузере", baseBp: 1 },
            { id: 3, name: "Поставить лайк любой анкете в Match", baseBp: 1 },
            { id: 4, name: "Зайти в любой канал в Brawl", baseBp: 1 },
            { id: 5, name: "Добавить 5 видео в кинотеатре", baseBp: 1 },
            { id: 6, name: "Арендовать киностудию", baseBp: 2 },
            { id: 7, name: "Забить 2 гола в футболе", baseBp: 1 },
            { id: 8, name: "Починить деталь в автосервисе", baseBp: 1 },
            { id: 9, name: "Успешная тренировка в тире", baseBp: 1 },
            { id: 10, name: "Поиграть 1 минуту в настольный теннис", baseBp: 1 },
            { id: 11, name: "10 действий на ферме", baseBp: 1 },
            { id: 12, name: "Нули в казино", baseBp: 2 },
            { id: 13, name: "Ставка межсерверное колесо", baseBp: 3 },
            { id: 14, name: "Забросить 2 мяча в баскетболе", baseBp: 1 },
            { id: 15, name: "Поиграть 1 минуту в большой теннис", baseBp: 1 },
            { id: 16, name: "Победить в дартс", baseBp: 1 },
            { id: 17, name: "Забить 10 голов в волейболе", baseBp: 1 },
            { id: 18, name: "Сделать платёж по лизингу", baseBp: 1 },
            { id: 19, name: "25 действий на стройке", baseBp: 2 },
            { id: 20, name: "25 действий в порту", baseBp: 2 },
            { id: 21, name: "25 действий в шахте", baseBp: 2 },
            { id: 22, name: "26 круга на любом маршруте автобусника", baseBp: 2 }, // В тексте опечатка "2 круга", сохранено по смыслу
            { id: 23, name: "Выполнить 2 квеста любых клубов", baseBp: 4 },
            { id: 24, name: "Проехать 1 станцию на метро", baseBp: 2 },
            { id: 25, name: "Поймать 20 рыб", baseBp: 4 },
            { id: 26, name: "Кинуть мяч питомцу 15 раз", baseBp: 2 },
            { id: 27, name: "15 выполненных питомцем команд", baseBp: 2 },
            { id: 28, name: "20 подходов в тренажерном зале", baseBp: 1 },
            { id: 29, name: "Выкопать 1 сокровище", baseBp: 1 },
            { id: 30, name: "5 раз снять 100% шкуру с животных", baseBp: 2 },
            { id: 31, name: "Выполнить 3 заказа дальнобойщиком", baseBp: 2 },
            { id: 32, name: "Сыграть в мафию в казино", baseBp: 3 },
            { id: 33, name: "Выиграть гонку в картинге", baseBp: 1 },
            { id: 34, name: "Проехать 1 уличную гонку (через тлф. ставка от 1000$)", baseBp: 1 },
            { id: 35, name: "Выиграть 5 игр в тренировочном комплексе со ставкой (от 100$)", baseBp: 1 },
            { id: 36, name: "Выиграть 3 любых игры на арене со ставкой (от 100$)", baseBp: 1 },
            { id: 37, name: "3 победы в Дэнс Баттлах", baseBp: 2 },
            { id: 38, name: "Победить в армрестлинге", baseBp: 1 },
            { id: 39, name: "Починка авто другому игроку", baseBp: 2 },
            { id: 40, name: "10 посылок на почте", baseBp: 1 },
            { id: 41, name: "Прокрутить за DP серебряный или золотой кейс", baseBp: 10 },
            { id: 42, name: "Заказ материалов для бизнеса вручную (просто прожать вкл/выкл)", baseBp: 1 },
            { id: 43, name: "Потушить 25 «огоньков» пожарным", baseBp: 1 },
            { id: 44, name: "Два раза оплатить смену внешности у хирурга в EMS", baseBp: 2 },
            { id: 45, name: "Принять участие в двух аирдропах", baseBp: 4 },
            { id: 46, name: "7 закрашенных граффити", baseBp: 1 },
            { id: 47, name: "Сдать 5 контрабанды", baseBp: 2 },
            { id: 48, name: "Участие в каптах/бизварах", baseBp: 1 },
            { id: 49, name: "Сдать Хаммер с ВЗХ", baseBp: 3 },
            { id: 50, name: "5 выданных медкарт в EMS", baseBp: 2 },
            { id: 51, name: "Закрыть 15 вызовов в EMS", baseBp: 2 },
            { id: 52, name: "Отредактировать 40 объявлений в WN", baseBp: 2 },
            { id: 53, name: "Взломать 15 замков на ограбах домов или автоугонах", baseBp: 2 },
            { id: 54, name: "Закрыть 5 кодов в силовых структурах", baseBp: 2 },
            { id: 55, name: "Поставить на учет 2 автомобиля (для LSPD)", baseBp: 1 },
            { id: 56, name: "Произвести 1 арест в КПЗ", baseBp: 1 },
            { id: 57, name: "Выкупить двух человек из КПЗ", baseBp: 2 },
            { id: 58, name: "Посадить траву в теплице", baseBp: 4 },
            { id: 59, name: "Запустить переработку обезболивающих в лаборатории", baseBp: 4 }
        ];

        // Глобальное состояние приложения
        let state = {
            isVip: false,
            isX2: false,
            onlineHours: 0,
            completedTasks: new Set() // Хранит id выполненных задач
        };

        // DOM элементы
        const tasksContainer = document.getElementById('tasks-container');
        const btnVip = document.getElementById('btn-vip');
        const btnX2 = document.getElementById('btn-x2');
        const btnReset = document.getElementById('btn-reset');
        
        const onlineHoursEl = document.getElementById('online-hours');
        const onlineCurrentBpEl = document.getElementById('online-current-bp');
        const onlineBpCounterEl = document.getElementById('online-bp-counter');
        const onlineMinusBtn = document.getElementById('online-minus');
        const onlinePlusBtn = document.getElementById('online-plus');

        const statEarnedEl = document.getElementById('stat-earned');
        const statLeftEl = document.getElementById('stat-left');
        const statPercentEl = document.getElementById('stat-percent');
        const progressFill = document.getElementById('progress-fill');
        const statTasksCountEl = document.getElementById('stat-tasks-count');

        // Вычисление текущего множителя
        function getMultiplier() {
            let mult = 1;
            if (state.isVip) mult *= 2;
            if (state.isX2) mult *= 2;
            return mult;
        }

        // Вычисление BP за конкретный таск на основе текущих модификаторов
        function calculateTaskBp(baseBp) {
            return baseBp * getMultiplier();
        }

        // Вычисление BP за онлайн
        function calculateOnlineBp() {
            // Каждые 3 часа: база = 2 BP. 
            // Множители работают стандартно (VIP -> 4 BP, VIP+X2 -> 8 BP)
            const steps = Math.floor(state.onlineHours / 3);
            const baseOnlineStepBp = 2;
            return steps * baseOnlineStepBp * getMultiplier();
        }

        // Максимально возможное количество BP при текущих тумблерах
        function calculateMaxPossibleBp() {
            let totalTasksBase = TASKS_DATA.reduce((sum, t) => sum + t.baseBp, 0);
            let maxOnlineBase = 16; // Для 24 часов база равна 16 BP
            return (totalTasksBase + maxOnlineBase) * getMultiplier();
        }

        // Обновление интерфейса статистики
        function updateStatistics() {
            let earnedFromTasks = 0;
            TASKS_DATA.forEach(task => {
                if (state.completedTasks.has(task.id)) {
                    earnedFromTasks += calculateTaskBp(task.baseBp);
                }
            });

            const onlineEarned = calculateOnlineBp();
            const totalEarned = earnedFromTasks + onlineEarned;
            const maxPossible = calculateMaxPossibleBp();
            const leftBp = Math.max(0, maxPossible - totalEarned);
            
            const percent = maxPossible > 0 ? Math.min(100, Math.round((totalEarned / maxPossible) * 100)) : 0;

            // Рендер цифр
            statEarnedEl.textContent = totalEarned;
            statLeftEl.textContent = leftBp;
            statPercentEl.textContent = `${percent}%`;
            progressFill.style.width = `${percent}%`;
            statTasksCountEl.textContent = state.completedTasks.size;

            // Обновление значений в карточке онлайна
            onlineCurrentBpEl.textContent = onlineEarned;
            // Показываем цену шага (за 3 часа)
            onlineBpCounterEl.textContent = 2 * getMultiplier();

            // Динамический пересчет текста цифр на самих плашках задач без перерендера всего DOM
            TASKS_DATA.forEach(task => {
                const badge = document.getElementById(`bp-badge-${task.id}`);
                if (badge) {
                    badge.textContent = `${calculateTaskBp(task.baseBp)} BP`;
                }
            });
        }

        // Генерация карточек квестов в DOM
        function renderTasks() {
            tasksContainer.innerHTML = '';
            TASKS_DATA.forEach(task => {
                const isChecked = state.completedTasks.has(task.id);
                
                const card = document.createElement('div');
                card.className = `glass task-card p-4 flex items-center justify-between gap-4 ${isChecked ? 'active' : ''}`;
                card.setAttribute('data-id', task.id);

                card.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0 select-none">
                        <input type="checkbox" class="custom-checkbox flex-shrink-0" ${isChecked ? 'checked' : ''}>
                        <span class="text-xs font-medium text-gray-200 leading-snug truncate md:whitespace-normal">${task.name}</span>
                    </div>
                    <span id="bp-badge-${task.id}" class="flex-shrink-0 text-[10px] font-bold border border-white/10 px-2.5 py-1 rounded-full text-white bg-white/5">
                        ${calculateTaskBp(task.baseBp)} BP
                    </span>
                `;

                // Элементы управления событиями клика
                const checkbox = card.querySelector('.custom-checkbox');
                
                const toggleTask = () => {
                    if (state.completedTasks.has(task.id)) {
                        state.completedTasks.delete(task.id);
                        card.classList.remove('active');
                        checkbox.checked = false;
                    } else {
                        state.completedTasks.add(task.id);
                        card.classList.add('active');
                        checkbox.checked = true;
                    }
                    updateStatistics();
                };

                card.addEventListener('click', (e) => {
                    if(e.target !== checkbox) toggleTask();
                });
                checkbox.addEventListener('change', () => {
                    toggleTask();
                });

                tasksContainer.appendChild(card);
            });
        }

        // Логика кнопок онлайна
        onlineMinusBtn.addEventListener('click', () => {
            if (state.onlineHours >= 3) {
                state.onlineHours -= 3;
                onlineHoursEl.textContent = `${state.onlineHours}ч`;
                updateStatistics();
            }
        });

        onlinePlusBtn.addEventListener('click', () => {
            if (state.onlineHours < 24) {
                state.onlineHours += 3;
                onlineHoursEl.textContent = `${state.onlineHours}ч`;
                updateStatistics();
            }
        });

        // Слушатели верхних переключателей режима
        btnVip.addEventListener('click', () => {
            state.isVip = !state.isVip;
            btnVip.classList.toggle('active', state.isVip);
            updateStatistics();
        });

        btnX2.addEventListener('click', () => {
            state.isX2 = !state.isX2;
            btnX2.classList.toggle('active', state.isX2);
            updateStatistics();
        });

        btnReset.addEventListener('click', () => {
            state.completedTasks.clear();
            state.onlineHours = 0;
            state.isVip = false;
            state.isX2 = false;
            
            btnVip.classList.remove('active');
            btnX2.classList.remove('active');
            onlineHoursEl.textContent = '0ч';
            
            document.querySelectorAll('.task-card').forEach(card => {
                card.classList.remove('active');
                card.querySelector('.custom-checkbox').checked = false;
            });
            
            updateStatistics();
        });

        // Инициализация
        renderTasks();
        updateStatistics();
    </script>
</body>
</html>
