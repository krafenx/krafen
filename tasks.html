    <style nonce="__CSP_NONCE__">
        :root {
            --bg: #050505;
            --card: rgba(20, 20, 20, 0.6);
            --accent: #5b2333;
            --accent-light: #f7f4f3;
            --accent-dark: #5b2333;
            --accent-gradient: linear-gradient(135deg, var(--accent-light), var(--accent-dark));
            --accent-soft: linear-gradient(135deg, rgba(247, 244, 243, 0.12), rgba(91, 35, 51, 0.28));
            --border: rgba(255, 255, 255, 0.05);
        }
        body {
            background-color: var(--bg);
            font-family: 'JetBrains Mono', monospace;
            color: #efefef;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .glass {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }
        .glass:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }
        .task-card {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .task-card:hover {
            border-color: var(--accent);
            background: rgba(91, 35, 51, 0.05);
        }
        .task-card.active {
            border-color: rgba(91, 35, 51, 0.8);
            background: rgba(91, 35, 51, 0.15);
            box-shadow: 0 0 20px rgba(91, 35, 51, 0.15);
        }
        .custom-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.375rem;
            outline: none;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }
        .custom-checkbox:checked {
            background: linear-gradient(135deg, #f7f4f3, #5b2333);
            border-color: transparent;
        }
        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: #050505;
            font-size: 0.75rem;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .toggle-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }
        .toggle-btn.active[data-type="vip"] {
            background: rgba(247, 244, 243, 0.1);
            border-color: rgba(247, 244, 243, 0.4);
            color: #fff;
        }
        .toggle-btn.active[data-type="x2"] {
            background: rgba(91, 35, 51, 0.3);
            border-color: #5b2333;
            color: #ffcbd1;
        }
        .toggle-btn.active-timer {
            background: rgba(91, 35, 51, 0.25);
            border-color: rgba(161, 61, 86, 0.5);
            color: #ffcbd1;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #5b2333, #a13d56);
            box-shadow: 0 0 10px rgba(161, 61, 86, 0.5);
            transition: width 0.3s ease;
        }
        .top-nav {
            width: calc(100vw - 3rem);
            max-width: 72rem;
            margin: 0 auto 1.4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        @media (min-width: 768px) { .top-nav { width: calc(100vw - 6rem); } }
    </style>

            // НЕ ХОЧЕТСЯ ДЕЛАТЬ (Душные, долгие или рандомные задания)

            { id: 43, name: "Потушить 25 «огоньков» пожарным", baseBp: 1, category: "skip" }
        ];

        const CATEGORIES_NAMES = {
            easy: "Легкие задания",
            medium: "Средние задания",
            coop: "Совместные задания / Мини-игры",
            fraction: "Фракционные задания",
            skip: "Не хочется делать (Душные / Долгие)"
        };

        const CLUBS_DATA = [
            { id: "epsilon", name: "Epsilon Programs" },
            { id: "merryweather", name: "Merryweather" },
            { id: "rednecks", name: "Rednecks" },
            { id: "carmeet", name: "Carmeet" },
            { id: "lost", name: "Lost MC" }
        ];

        const TIMER_DURATION = 2 * 60 * 60; // 2 часа в секундах

        // Глобальное состояние приложения
        let state = {
            isVip: false,
            isX2: false,
            onlineHours: 0,
            completedTasks: new Set(),
            timers: {} // Будет хранить { id: { endTime: timestamp/null, timeLeft: seconds, running: bool } }
        };

        // Инициализация дефолтных таймеров в стейте
        CLUBS_DATA.forEach(club => {
            state.timers[club.id] = { endTime: null, timeLeft: TIMER_DURATION, running: false };
        });

        // Ключ для хранения в localStorage
        const STORAGE_KEY = 'krafen_bp_calculator_state';

        // DOM элементы
        const categoriesContainer = document.getElementById('categories-container');
        const timersContainer = document.getElementById('timers-container');
        const btnVip = document.getElementById('btn-vip');
        const btnX2 = document.getElementById('btn-x2');
        const btnReset = document.getElementById('btn-reset');
        
        const onlineHoursEl = document.getElementById('online-hours');
        const onlineCurrentBpEl = document.getElementById('online-current-bp');
        const onlineBpCounterEl = document.getElementById('online-bp-counter');
        const onlineMinusBtn = document.getElementById('online-minus');
        const onlinePlusBtn = document.getElementById('online-plus');

        const statEarnedEl = document.getElementById('stat-earned');
        const statLeftEl = document.getElementById('stat-left');
        const statPercentEl = document.getElementById('stat-percent');
        const progressFill = document.getElementById('progress-fill');
        const statTasksCountEl = document.getElementById('stat-tasks-count');

        // Звуковое оповещение через встроенный Web Audio API (без внешних зависимостей)
        function playNotificationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                function beep(delay, freq, duration) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    // 'triangle' вместо 'sine' делает звук более заметным и глубоким
                    osc.type = 'triangle'; 
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
                    
                    // Повысили базовую громкость до 0.6 (было 0.15)
                    gain.gain.setValueAtTime(0.6, ctx.currentTime + delay);
                    // Плавное затухание к концу ноты
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + duration);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + delay);
                    osc.stop(ctx.currentTime + delay + duration);
                }
                
                // Размеренный мажорный аккорд — ноты длятся дольше и перетекают друг в друга
                beep(0, 523.25, 0.5);    // Нота 1 (длительность 0.5 сек)
                beep(0.2, 659.25, 0.5);   // Нота 2 (вступает через 0.2 сек)
                beep(0.4, 783.99, 0.8);   // Нота 3 (вступает через 0.4 сек, финал)
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }

        // Сохранение в localStorage
        function saveState() {
            const dataToSave = {
                isVip: state.isVip,
                isX2: state.isX2,
                onlineHours: state.onlineHours,
                completedTasks: Array.from(state.completedTasks),
                timers: state.timers
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
        }

        // Загрузка из localStorage
        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;
            try {
                const parsed = JSON.parse(saved);
                state.isVip = parsed.isVip || false;
                state.isX2 = parsed.isX2 || false;
                state.onlineHours = parsed.onlineHours || 0;
                state.completedTasks = new Set(parsed.completedTasks || []);
                
                if (parsed.timers) {
                    Object.keys(parsed.timers).forEach(id => {
                        if (state.timers[id]) {
                            state.timers[id] = parsed.timers[id];
                            // Если таймер был запущен, пересчитываем оставшееся время на основе сохраненного метки конца
                            if (state.timers[id].running && state.timers[id].endTime) {
                                let rem = Math.ceil((state.timers[id].endTime - Date.now()) / 1000);
                                if (rem <= 0) {
                                    state.timers[id].running = false;
                                    state.timers[id].endTime = null;
                                    state.timers[id].timeLeft = TIMER_DURATION;
                                } else {
                                    state.timers[id].timeLeft = rem;
                                }
                            }
                        }
                    });
                }

                // Синхронизируем визуальное состояние системных кнопок и онлайна
                btnVip.classList.toggle('active', state.isVip);
                btnX2.classList.toggle('active', state.isX2);
                onlineHoursEl.textContent = `${state.onlineHours}ч`;
            } catch (e) {
                console.error("Ошибка загрузки данных из localStorage", e);
            }
        }

        function getMultiplier() {
            let mult = 1;
            if (state.isVip) mult *= 2;
            if (state.isX2) mult *= 2;
            return mult;
        }

        function calculateTaskBp(baseBp) {
            return baseBp * getMultiplier();
        }

        function calculateOnlineBp() {
            const steps = Math.floor(state.onlineHours / 3);
            const baseOnlineStepBp = 2;
            return steps * baseOnlineStepBp * getMultiplier();
        }

        function calculateMaxPossibleBp() {
            let totalTasksBase = TASKS_DATA.reduce((sum, t) => sum + t.baseBp, 0);
            let maxOnlineBase = 16;
            return (totalTasksBase + maxOnlineBase) * getMultiplier();
        }

        function updateStatistics() {
            let earnedFromTasks = 0;
            TASKS_DATA.forEach(task => {
                if (state.completedTasks.has(task.id)) {
                    earnedFromTasks += calculateTaskBp(task.baseBp);
                }
            });

            const onlineEarned = calculateOnlineBp();
            const totalEarned = earnedFromTasks + onlineEarned;
            const maxPossible = calculateMaxPossibleBp();
            const leftBp = Math.max(0, maxPossible - totalEarned);
            
            const percent = maxPossible > 0 ? Math.min(100, Math.round((totalEarned / maxPossible) * 100)) : 0;

            statEarnedEl.textContent = totalEarned;
            statLeftEl.textContent = leftBp;
            statPercentEl.textContent = `${percent}%`;
            progressFill.style.width = `${percent}%`;
            statTasksCountEl.textContent = state.completedTasks.size;

            onlineCurrentBpEl.textContent = onlineEarned;
            onlineBpCounterEl.textContent = 2 * getMultiplier();

            TASKS_DATA.forEach(task => {
                const badge = document.getElementById(`bp-badge-${task.id}`);
                if (badge) {
                    badge.textContent = `${calculateTaskBp(task.baseBp)} BP`;
                }
            });
        }

        // Форматирование секунд в 00:00:00
        function formatTime(totalSeconds) {
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // Рендер клубных таймеров
        function renderTimers() {
            timersContainer.innerHTML = '';
            CLUBS_DATA.forEach(club => {
                const timerState = state.timers[club.id];
                const card = document.createElement('div');
                card.className = "glass p-4 flex flex-col justify-between items-center text-center space-y-3";
                card.id = `timer-card-${club.id}`;

                card.innerHTML = `
                    <div class="text-[10px] uppercase tracking-wider text-white/50 font-bold leading-tight min-h-[20px] flex items-center justify-center">
                        ${club.name}
                    </div>
                    <div id="display-${club.id}" class="text-xl font-bold tracking-tight text-white select-none">
                        ${formatTime(timerState.timeLeft)}
                    </div>
                    <div class="flex gap-1.5 w-full">
                        <button id="btn-start-${club.id}" class="toggle-btn text-[9px] uppercase tracking-widest py-1.5 flex-1 rounded-md font-bold transition">
                            ${timerState.running ? 'Пауза' : 'Старт'}
                        </button>
                        <button id="btn-reset-${club.id}" class="text-[9px] text-white/30 uppercase tracking-widest py-1.5 px-2 rounded-md border border-white/5 hover:border-white/20 hover:text-white/80 transition">
                            ✕
                        </button>
                    </div>
                `;

                const startBtn = card.querySelector(`#btn-start-${club.id}`);
                const resetBtn = card.querySelector(`#btn-reset-${club.id}`);

                if (timerState.running) startBtn.classList.add('active-timer');

                startBtn.addEventListener('click', () => {
                    if (timerState.running) {
                        // Пауза
                        timerState.running = false;
                        timerState.timeLeft = Math.max(0, Math.ceil((timerState.endTime - Date.now()) / 1000));
                        timerState.endTime = null;
                        startBtn.textContent = 'Старт';
                        startBtn.classList.remove('active-timer');
                    } else {
                        // Старт
                        timerState.running = true;
                        timerState.endTime = Date.now() + (timerState.timeLeft * 1000);
                        startBtn.textContent = 'Пауза';
                        startBtn.classList.add('active-timer');
                    }
                    saveState();
                });

                resetBtn.addEventListener('click', () => {
                    timerState.running = false;
                    timerState.endTime = null;
                    timerState.timeLeft = TIMER_DURATION;
                    startBtn.textContent = 'Старт';
                    startBtn.classList.remove('active-timer');
                    document.getElementById(`display-${club.id}`).textContent = formatTime(TIMER_DURATION);
                    saveState();
                });

                timersContainer.appendChild(card);
            });
        }

        // Единый интервал для обработки тиков всех таймеров (1 раз в секунду)
        setInterval(() => {
            let stateChanged = false;
            CLUBS_DATA.forEach(club => {
                const timerState = state.timers[club.id];
                if (timerState.running && timerState.endTime) {
                    let rem = Math.ceil((timerState.endTime - Date.now()) / 1000);
                    if (rem <= 0) {
                        // Таймер завершился
                        timerState.running = false;
                        timerState.endTime = null;
                        timerState.timeLeft = TIMER_DURATION;
                        
                        const display = document.getElementById(`display-${club.id}`);
                        if (display) display.textContent = formatTime(TIMER_DURATION);
                        
                        const startBtn = document.getElementById(`btn-start-${club.id}`);
                        if (startBtn) {
                            startBtn.textContent = 'Старт';
                            startBtn.classList.remove('active-timer');
                        }
                        
                        playNotificationSound();
                        stateChanged = true;
                    } else {
                        timerState.timeLeft = rem;
                        const display = document.getElementById(`display-${club.id}`);
                        if (display) display.textContent = formatTime(rem);
                    }
                }
            });
            if (stateChanged) saveState();
        }, 1000);

        // Рендерим задания секциями на основе заданных категорий
        function renderTasks() {
            categoriesContainer.innerHTML = '';

            Object.keys(CATEGORIES_NAMES).forEach(categoryKey => {
                const filteredTasks = TASKS_DATA.filter(t => t.category === categoryKey);
                if (filteredTasks.length === 0) return;

                const section = document.createElement('div');
                section.className = "space-y-3";

                const title = document.createElement('h3');
                title.className = "text-xs font-bold uppercase opacity-40 tracking-[0.15em] mb-2 pl-1";
                title.textContent = CATEGORIES_NAMES[categoryKey];
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4";

                filteredTasks.forEach(task => {
                    const isChecked = state.completedTasks.has(task.id);
                    
                    const card = document.createElement('div');
                    card.className = `glass task-card p-4 flex items-center justify-between gap-4 ${isChecked ? 'active' : ''}`;
                    card.setAttribute('data-id', task.id);

                    card.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0 select-none">
                            <input type="checkbox" class="custom-checkbox flex-shrink-0" ${isChecked ? 'checked' : ''}>
                            <span class="text-xs font-medium text-gray-200 leading-snug truncate md:whitespace-normal">${task.name}</span>
                        </div>
                        <span id="bp-badge-${task.id}" class="flex-shrink-0 text-[10px] font-bold border border-white/10 px-2.5 py-1 rounded-full text-white bg-white/5">
                            ${calculateTaskBp(task.baseBp)} BP
                        </span>
                    `;

                    const checkbox = card.querySelector('.custom-checkbox');
                    
                    const toggleTask = () => {
                        if (state.completedTasks.has(task.id)) {
                            state.completedTasks.delete(task.id);
                            card.classList.remove('active');
                            checkbox.checked = false;
                        } else {
                            state.completedTasks.add(task.id);
                            card.classList.add('active');
                            checkbox.checked = true;
                        }
                        updateStatistics();
                        saveState(); 
                    };

                    card.addEventListener('click', (e) => {
                        if(e.target !== checkbox) toggleTask();
                    });
                    checkbox.addEventListener('change', () => {
                        toggleTask();
                    });

                    grid.appendChild(card);
                });

                section.appendChild(grid);
                categoriesContainer.appendChild(section);
            });
        }

        // Логика кликов для карточки онлайн-прогресса
        onlineMinusBtn.addEventListener('click', () => {
            if (state.onlineHours >= 3) {
                state.onlineHours -= 3;
                onlineHoursEl.textContent = `${state.onlineHours}ч`;
                updateStatistics();
                saveState(); 
            }
        });

        onlinePlusBtn.addEventListener('click', () => {
            if (state.onlineHours < 24) {
                state.onlineHours += 3;
                onlineHoursEl.textContent = `${state.onlineHours}ч`;
                updateStatistics();
                saveState(); 
            }
        });

        // Слушатели системных переключателей (VIP / X2 / Сброс)
        btnVip.addEventListener('click', () => {
            state.isVip = !state.isVip;
            btnVip.classList.toggle('active', state.isVip);
            updateStatistics();
            saveState(); 
        });

        btnX2.addEventListener('click', () => {
            state.isX2 = !state.isX2;
            btnX2.classList.toggle('active', state.isX2);
            updateStatistics();
            saveState(); 
        });

        btnReset.addEventListener('click', () => {
            state.completedTasks.clear();
            state.onlineHours = 0;
            state.isVip = false;
            state.isX2 = false;
            
            // Сброс таймеров
            CLUBS_DATA.forEach(club => {
                state.timers[club.id] = { endTime: null, timeLeft: TIMER_DURATION, running: false };
            });
            
            btnVip.classList.remove('active');
            btnX2.classList.remove('active');
            onlineHoursEl.textContent = '0ч';
            
            document.querySelectorAll('.task-card').forEach(card => {
                card.classList.remove('active');
                card.querySelector('.custom-checkbox').checked = false;
            });
            
            renderTimers();
            updateStatistics();
            localStorage.removeItem(STORAGE_KEY); 
        });

        // Порядок запуска:
        loadState();        // 1. Сначала подтягиваем кэш
        renderTimers();     // 2. Строим блок таймеров
        renderTasks();      // 3. Строим карточки заданий
        updateStatistics(); // 4. Считаем циферки
    </script>
</body>
</html>
