<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wall — krafen</title>
    <meta name="description" content="Leave a message for krafen.">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/krafenx/krafen/8c5ff5d6ae7d406899fbf4906d5bc543e06c6648/cherry-blossom.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --card: rgba(13, 13, 13, 0.45);
            --accent: #5b2333;
            --accent-light: #f7f4f3;
            --border: rgba(255, 255, 255, 0.04);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html {
            width: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            font-family: "JetBrains Mono", monospace;
            color: #e4e4e7;
            min-height: 100vh;
            width: 100%;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(91, 35, 51, 0.18), transparent 55%);
            pointer-events: none;
            z-index: -1;
        }

        /* Starfield */
        #starfield { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -2; }
        .stars { position: absolute; inset: -100%; }
        .stars-small {
            background-image:
                radial-gradient(1px 1px at 40px 60px, #fff, transparent),
                radial-gradient(1px 1px at 120px 180px, #fff, transparent),
                radial-gradient(1px 1px at 220px 340px, #fff, transparent),
                radial-gradient(1px 1px at 460px 120px, #fff, transparent),
                radial-gradient(1px 1px at 700px 540px, #fff, transparent);
            background-size: 800px 800px;
            opacity: 0.45;
            animation: drift-small 240s linear infinite;
        }
        .stars-medium {
            background-image:
                radial-gradient(2px 2px at 100px 140px, #fff, transparent),
                radial-gradient(2px 2px at 350px 500px, #fff, transparent),
                radial-gradient(2px 2px at 700px 260px, #fff, transparent);
            background-size: 1000px 1000px;
            opacity: 0.35;
            animation: drift-medium 180s linear infinite;
        }
        .stars-large {
            background-image:
                radial-gradient(3px 3px at 250px 250px, #fff, transparent),
                radial-gradient(3px 3px at 900px 600px, #fff, transparent);
            background-size: 1200px 1200px;
            opacity: 0.25;
            animation: drift-large 120s linear infinite;
        }
        @keyframes drift-small  { from { transform: translateY(0); } to { transform: translateY(800px);  } }
        @keyframes drift-medium { from { transform: translateY(0); } to { transform: translateY(1000px); } }
        @keyframes drift-large  { from { transform: translateY(0); } to { transform: translateY(1200px); } }

        /* Glass card */
        .glass {
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 0.85rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Nav links */
        .top-nav-link {
            color: rgba(255,255,255,0.3);
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .top-nav-link:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }

        /* Buttons */
        .btn-action {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            color: #d4d4d8;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-action:hover {
            background: rgba(91,35,51,0.2);
            border-color: rgba(91,35,51,0.5);
            color: #fff;
        }
        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Shimmer */
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite;
        }
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position:  200% 0; }
        }

        /* Wall inputs */
        .wall-input {
            width: 100%;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 0.5rem;
            padding: 0.55rem 0.75rem;
            color: #e4e4e7;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .wall-input:focus { border-color: rgba(91,35,51,0.6); }
        .wall-input::placeholder { color: #52525b; }
        .wall-textarea { resize: none; height: 72px; line-height: 1.55; }

        /* Message items */
        .wall-messages-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .wall-messages-list::-webkit-scrollbar { width: 3px; }
        .wall-messages-list::-webkit-scrollbar-track { background: transparent; }
        .wall-messages-list::-webkit-scrollbar-thumb { background: rgba(91,35,51,0.4); border-radius: 2px; }

        .wall-msg {
            background: rgba(0,0,0,0.18);
            border: 1px solid rgba(255,255,255,0.04);
            border-left: 2px solid rgba(91,35,51,0.5);
            border-radius: 0.5rem;
            padding: 0.55rem 0.75rem;
            transition: border-left-color 0.2s ease;
            animation: msg-in 0.25s ease;
        }
        .wall-msg:hover { border-left-color: rgba(91,35,51,0.9); }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        /* Realtime dot */
        .rt-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(91,35,51,0.5);
            display: inline-block;
            flex-shrink: 0;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .rt-dot.active {
            background: #4ade80;
            box-shadow: 0 0 6px rgba(74,222,128,0.5);
        }

        /* Char counter */
        #wall-char-counter { transition: color 0.2s ease; }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-10 flex flex-col items-center">

    <div id="starfield">
        <div class="stars stars-small"></div>
        <div class="stars stars-medium"></div>
        <div class="stars stars-large"></div>
    </div>

    <div class="w-full max-w-2xl flex flex-col">

        <!-- Nav -->
        <nav class="w-full flex items-center justify-between mb-5 px-1">
            <a class="top-nav-link" href="/">&larr; back</a>
            <span class="text-[10px] text-zinc-600 uppercase tracking-[0.25em]">wall</span>
        </nav>

        <!-- Wall card -->
        <div class="glass p-5 sm:p-6">

            <!-- Header -->
            <div class="flex items-center justify-between mb-5 pb-3 border-b border-white/5">
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-[10px] font-bold uppercase text-zinc-500 tracking-[0.2em]">Wall of Messages</h1>
                        <span id="rt-dot" class="rt-dot" title="Realtime status"></span>
                    </div>
                    <p class="text-[9px] text-zinc-600 mt-1">Leave a note — it shows up for everyone instantly.</p>
                </div>
                <span id="wall-count" class="text-[9px] text-zinc-600 uppercase tracking-wider"></span>
            </div>

            <!-- Form -->
            <div class="flex flex-col gap-2 mb-5">
                <input
                    id="wall-name"
                    type="text"
                    class="wall-input"
                    placeholder="your nickname"
                    maxlength="32"
                    autocomplete="off"
                    spellcheck="false"
                >
                <textarea
                    id="wall-text"
                    class="wall-input wall-textarea"
                    placeholder="say something..."
                    maxlength="200"
                    spellcheck="false"
                ></textarea>
                <div class="flex items-center justify-between gap-2">
                    <span id="wall-char-counter" class="text-[9px] text-zinc-600 tracking-wider">0 / 200</span>
                    <button id="wall-submit" class="rounded px-4 py-1.5 text-[9px] uppercase tracking-wider btn-action">
                        Send
                    </button>
                </div>
                <p id="wall-error" class="text-[9px] text-red-400/60 hidden">Failed to send. Try again.</p>
            </div>

            <!-- Divider -->
            <div class="border-t border-white/5 mb-4"></div>

            <!-- Messages -->
            <div id="wall-messages" class="wall-messages-list">
                <div class="h-9 bg-white/5 rounded shimmer"></div>
                <div class="h-9 bg-white/5 rounded shimmer" style="opacity:.6"></div>
                <div class="h-9 bg-white/5 rounded shimmer" style="opacity:.35"></div>
            </div>

        </div>

        <!-- Footer -->
        <p class="text-center text-[8px] text-zinc-700 uppercase tracking-[0.2em] mt-6">krafen.me / wall</p>

    </div>

    <script>
        /* ── CONFIG ── замени на свои ключи из Supabase → Project Settings → API ── */
        const WALL_CONFIG = {
            supabase_url: 'https://osvefwrcgpapuywiornk.supabase.co/rest/v1/',
            supabase_key: 'sb_publishable_K0UcyHkxogM8mRWW-gjhdA_xWD7Vis-',
            table: 'messages',
            limit: 80,
        };

        /* ── HELPERS ── */
        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function timeAgo(iso) {
            const diff = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
            if (diff < 60)     return 'just now';
            if (diff < 3600)   return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400)  return `${Math.floor(diff / 3600)}h ago`;
            return new Date(iso).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }

        function setDot(active) {
            document.getElementById('rt-dot')?.classList.toggle('active', active);
        }

        function flashDot() {
            setDot(true);
            setTimeout(() => setDot(false), 1400);
        }

        /* ── RENDER ── */
        function renderMessages(messages) {
            const container = document.getElementById('wall-messages');
            const counter   = document.getElementById('wall-count');
            if (!container) return;

            if (counter) {
                counter.textContent = messages.length > 0
                    ? `${messages.length} message${messages.length !== 1 ? 's' : ''}`
                    : '';
            }

            if (!messages.length) {
                container.innerHTML = '<div class="text-[10px] text-zinc-600 uppercase tracking-wider py-2">No messages yet. Be the first.</div>';
                return;
            }

            container.innerHTML = messages.map(msg => `
                <div class="wall-msg">
                    <div class="flex items-baseline justify-between gap-2 mb-1">
                        <span class="text-[10px] font-semibold text-zinc-300 truncate">${escapeHTML(msg.name)}</span>
                        <span class="text-[8px] text-zinc-600 flex-shrink-0">${timeAgo(msg.created_at)}</span>
                    </div>
                    <div class="text-[11px] text-zinc-400 leading-relaxed break-words">${escapeHTML(msg.text)}</div>
                </div>
            `).join('');
        }

        /* ── INIT ── */
        (function init() {
            if (WALL_CONFIG.supabase_url === 'YOUR_SUPABASE_URL') {
                document.getElementById('wall-messages').innerHTML =
                    '<div class="text-[10px] text-zinc-600 uppercase tracking-wider py-2">Configure WALL_CONFIG to enable.</div>';
                return;
            }

            const client = supabase.createClient(WALL_CONFIG.supabase_url, WALL_CONFIG.supabase_key);

            /* Load */
            async function load() {
                const { data, error } = await client
                    .from(WALL_CONFIG.table)
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(WALL_CONFIG.limit);

                if (error) {
                    document.getElementById('wall-messages').innerHTML =
                        '<div class="text-[10px] text-red-400/60 uppercase tracking-wider">Failed to load.</div>';
                    return;
                }
                renderMessages(data || []);
            }

            load();

            /* Realtime */
            client
                .channel('wall-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: WALL_CONFIG.table }, () => {
                    flashDot();
                    load();
                })
                .subscribe(status => setDot(status === 'SUBSCRIBED'));

            /* Form */
            const nameEl    = document.getElementById('wall-name');
            const textEl    = document.getElementById('wall-text');
            const submitEl  = document.getElementById('wall-submit');
            const errorEl   = document.getElementById('wall-error');
            const counterEl = document.getElementById('wall-char-counter');

            textEl?.addEventListener('input', () => {
                const len = textEl.value.length;
                counterEl.textContent = `${len} / 200`;
                counterEl.style.color = len > 180 ? '#f87171' : '';
            });

            submitEl?.addEventListener('click', async () => {
                const name = nameEl.value.trim();
                const text = textEl.value.trim();
                if (!name || !text) return;

                submitEl.disabled = true;
                submitEl.textContent = '...';
                errorEl?.classList.add('hidden');

                const { error } = await client.from(WALL_CONFIG.table).insert([{ name, text }]);

                submitEl.disabled = false;
                submitEl.textContent = 'Send';

                if (error) {
                    errorEl?.classList.remove('hidden');
                } else {
                    textEl.value = '';
                    if (counterEl) counterEl.textContent = '0 / 200';
                }
            });
        })();
    </script>
</body>
</html>
