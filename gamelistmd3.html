<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krafen / gamelist</title>
    <meta name="description" content="Список игр krafen с оценками и отзывами">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/krafenx/krafen/8c5ff5d6ae7d406899fbf4906d5bc543e06c6648/cherry-blossom.png">
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
    <style>
        :root {
            --md-bg: #121318;
            --md-surface-container: #1e1f25;
            --md-surface-container-high: #2a2a31;
            --md-primary: #adc6ff;
            --md-on-primary: #002e69;
            --md-primary-container: #1d437e;
            --md-on-primary-container: #d8e2ff;
            --md-secondary-container: #3b465b;
            --md-on-secondary-container: #d7e3fc;
            --md-outline-variant: #44474f;
            --md-on-surface: #e2e2e9;
            --md-on-surface-variant: #c4c6d0;
        }

        body { background-color: var(--md-bg); font-family: 'Google Sans', sans-serif; color: var(--md-on-surface); }
        .m3-card { background-color: var(--md-surface-container); border: 1px solid var(--md-outline-variant); border-radius: 24px; }
        
        .filter-chip {
            background-color: transparent;
            border: 1px solid var(--md-outline-variant);
            color: var(--md-on-surface-variant);
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .filter-chip.active {
            background-color: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
            border-color: transparent;
        }
        .filter-chip strong { color: var(--md-primary); margin-left: 4px; }

        .m3-field {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--md-outline-variant);
            color: var(--md-on-surface);
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
        }
        .m3-field:focus { border-color: var(--md-primary); border-width: 2px; }

        .m3-btn { border-radius: 9999px; font-weight: 500; padding: 10px 24px; font-size: 14px; transition: opacity 0.2s; }
        .m3-btn:hover { opacity: 0.9; }

        .game-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            padding: 16px;
            background-color: var(--md-surface-container);
            border: 1px solid var(--md-outline-variant);
            border-radius: 16px;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .game-row:hover { background-color: var(--md-surface-container-high); }

        .modal {
            position: fixed; inset: 0; z-index: 100;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex; align-items: center; justify-content: center; padding: 16px;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal.open { opacity: 1; pointer-events: auto; }
        .modal-box {
            background-color: var(--md-surface-container-high);
            border-radius: 28px; padding: 24px;
            width: min(560px, 100%); max-height: 85vh; overflow-y: auto;
        }

        body:not(.is-admin) .admin-only { display: none !important; }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-12">
    <div class="max-w-4xl mx-auto w-full">
        
        <header class="flex justify-between items-center mb-6">
            <a href="/" class="text-sm font-medium text-[var(--md-primary)] hover:underline">← Главная</a>
            <h1 class="text-2xl font-bold tracking-tight">gamelist</h1>
        </header>

        <div class="m3-card p-4 mb-6">
            <div class="flex flex-wrap gap-2" id="stats-nav">
                <button class="filter-chip active" data-filter="all">Все игры<strong id="cnt-all">0</strong></button>
                <button class="filter-chip" data-filter="completed">Пройдено<strong id="cnt-completed">0</strong></button>
                <button class="filter-chip" data-filter="playing">Играю<strong id="cnt-playing">0</strong></button>
                <button class="filter-chip" data-filter="planned">В планах<strong id="cnt-planned">0</strong></button>
                <button class="filter-chip" data-filter="dropped">Брошено<strong id="cnt-dropped">0</strong></button>
            </div>
        </div>

        <div class="flex gap-3 items-center mb-6">
            <div class="flex-1">
                <input type="text" id="search-input" class="m3-field !rounded-full !py-2.5" placeholder="Поиск по названию...">
            </div>
            <button id="add-game-btn" class="m3-btn bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)] admin-only">Добавить игру</button>
            <button id="admin-login-btn" class="m3-btn border border-[var(--md-outline-variant)] text-[var(--md-primary)]" onclick="openAdminModal()">Админ</button>
        </div>

        <div id="game-list" class="space-y-3"></div>
    </div>

    <div id="modal-game" class="modal">
        <div class="modal-box space-y-4">
            <h2 class="text-xl font-bold text-white" id="modal-title">Добавить игру</h2>
            <div class="space-y-3">
                <input type="text" id="game-name-input" class="m3-field" placeholder="Название игры">
                <select id="game-status-input" class="m3-field bg-[var(--md-surface-container-high)]">
                    <option value="completed">Пройдено</option>
                    <option value="playing">Играю</option>
                    <option value="planned">В планах</option>
                    <option value="dropped">Брошено</option>
                </select>
                <div>
                    <label class="block text-xs text-[var(--md-on-surface-variant)] mb-1">Оценка: <span id="rating-value" class="font-bold text-[var(--md-primary)]">5.0</span></label>
                    <input type="range" id="rating-input" min="0" max="10" step="0.1" value="5.0" class="w-full accent-[var(--md-primary)]">
                </div>
                <div>
                    <textarea id="review-input" class="m3-field h-32 resize-none" placeholder="Отзыв..."></textarea>
                    <div class="text-[11px] text-right text-[var(--md-on-surface-variant)] mt-1" id="review-counter">0 / 700</div>
                </div>
            </div>
            <div class="flex justify-between items-center pt-2">
                <button id="delete-game-btn" class="m3-btn bg-red-900/20 text-red-400 border border-red-900/50 admin-only">Удалить</button>
                <div class="flex gap-2 ml-auto">
                    <button data-close="modal-game" class="m3-btn border border-[var(--md-outline-variant)] text-[var(--md-primary)]">Отмена</button>
                    <button id="save-game-btn" class="m3-btn bg-[var(--md-primary)] text-[var(--md-on-primary)]">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-view" class="modal">
        <div class="modal-box space-y-3">
            <div class="flex justify-between items-start gap-4">
                <h2 class="text-xl font-bold text-white" id="view-title">&mdash;</h2>
                <div class="text-right flex-shrink-0">
                    <div class="text-2xl font-bold text-[var(--md-primary)]" id="view-rating">&mdash;</div>
                    <div class="text-[10px] uppercase tracking-wider opacity-50" id="view-status">&mdash;</div>
                </div>
            </div>
            <p class="text-sm leading-relaxed text-[var(--md-on-surface-variant)] bg-black/20 p-4 rounded-xl border border-[var(--md-outline-variant)] whitespace-pre-wrap" id="view-review">&mdash;</p>
            <div class="text-[11px] opacity-40 text-right" id="view-date">&mdash;</div>
            <div class="flex justify-end pt-2">
                <button data-close="modal-view" class="m3-btn bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="modal-admin" class="modal">
        <div class="modal-box space-y-4">
            <h2 class="text-lg font-bold text-white">Вход в панель управления</h2>
            <input type="password" id="admin-password-input" class="m3-field" placeholder="Введите мастер-пароль">
            <div class="flex justify-end gap-2">
                <button data-close="modal-admin" class="m3-btn border border-[var(--md-outline-variant)] text-[var(--md-primary)]">Отмена</button>
                <button class="m3-btn bg-[var(--md-primary)] text-[var(--md-on-primary)]" onclick="submitAdminLogin()">Войти</button>
            </div>
        </div>
    </div>

    <script>
        let list = [];
        let currentFilter = 'all';
        let editingId = null;

        function isAdmin() { return localStorage.getItem('is_admin') === 'true'; }
        function checkAdminSession() {
            if (isAdmin()) {
                document.body.classList.add('is-admin');
                document.getElementById('admin-login-btn').textContent = 'Выйти';
            } else {
                document.body.classList.remove('is-admin');
                document.getElementById('admin-login-btn').textContent = 'Админ';
            }
        }
        function openAdminModal() {
            if (isAdmin()) { localStorage.removeItem('is_admin'); checkAdminSession(); renderList(); return; }
            openModal('modal-admin');
            document.getElementById('admin-password-input').focus();
        }
        function submitAdminLogin() {
            const pass = document.getElementById('admin-password-input').value;
            if (pass === 'krafen') { localStorage.setItem('is_admin', 'true'); closeModal('modal-admin'); checkAdminSession(); renderList(); }
            document.getElementById('admin-password-input').value = '';
        }

        function openModal(id) { document.getElementById(id).classList.add('open'); }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }

        function updateReviewCount() {
            const val = document.getElementById('review-input').value;
            document.getElementById('review-counter').textContent = `${val.length} / 700`;
        }

        function fetchList() {
            const localData = localStorage.getItem('krafen_gamelist');
            list = localData ? JSON.parse(localData) : [
                { id: '1', title: 'Cyberpunk 2077', status: 'playing', rating: 9.2, review: 'Отличный сюжет и визуальный стиль Найт-Сити.', date: '10.06.2026' }
            ];
            renderList();
        }

        function saveListState() {
            localStorage.setItem('krafen_gamelist', JSON.stringify(list));
            renderList();
        }

        function renderList() {
            const container = document.getElementById('game-list');
            container.innerHTML = '';
            const search = document.getElementById('search-input').value.toLowerCase().trim();

            const filtered = list.filter(item => {
                const matchFilter = currentFilter === 'all' || item.status === currentFilter;
                const matchSearch = item.title.toLowerCase().includes(search);
                return matchFilter && matchSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 opacity-40 text-sm">Ничего не найдено</div>`;
            }

            filtered.forEach((game, index) => {
                const el = document.createElement('div');
                el.className = 'game-row';
                el.dataset.id = game.id;
                el.innerHTML = `
                    <div class="min-w-0 flex flex-col justify-center">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-[var(--md-on-surface-variant)] opacity-60">#${index + 1}</span>
                            <h3 class="font-bold text-white text-base truncate">${escapeHTML(game.title)}</h3>
                        </div>
                        ${game.review ? `<p class="text-xs text-[var(--md-on-surface-variant)] line-clamp-2 mt-1 leading-relaxed">${escapeHTML(game.review)}</p>` : ''}
                    </div>
                    <div class="text-right flex flex-col justify-center flex-shrink-0">
                        <div class="text-xl font-bold text-[var(--md-primary)]">${Number(game.rating).toFixed(1)}</div>
                        <div class="text-[10px] uppercase font-bold tracking-wider opacity-40 mt-0.5">${game.status}</div>
                    </div>`;
                container.appendChild(el);
            });

            document.getElementById('cnt-all').textContent = list.length;
            document.getElementById('cnt-completed').textContent = list.filter(g => g.status === 'completed').length;
            document.getElementById('cnt-playing').textContent = list.filter(g => g.status === 'playing').length;
            document.getElementById('cnt-planned').textContent = list.filter(g => g.status === 'planned').length;
            document.getElementById('cnt-dropped').textContent = list.filter(g => g.status === 'dropped').length;
        }

        function escapeHTML(str) { return String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

        function openEditModal(item) {
            editingId = item.id;
            document.getElementById('modal-title').textContent = 'Редактировать игру';
            document.getElementById('game-name-input').value = item.title;
            document.getElementById('game-status-input').value = item.status;
            document.getElementById('rating-input').value = item.rating;
            document.getElementById('rating-value').textContent = Number(item.rating).toFixed(1);
            document.getElementById('review-input').value = item.review || '';
            updateReviewCount();
            document.getElementById('delete-game-btn').style.display = 'block';
            openModal('modal-game');
        }

        function openViewModal(item) {
            document.getElementById('view-title').textContent = item.title;
            document.getElementById('view-rating').textContent = Number(item.rating).toFixed(1);
            document.getElementById('view-status').textContent = item.status;
            document.getElementById('view-review').textContent = item.review || 'Отзыв отсутствует.';
            document.getElementById('view-date').textContent = item.date || '';
            openModal('modal-view');
        }

        document.getElementById('add-game-btn').addEventListener('click', () => {
            editingId = null;
            document.getElementById('modal-title').textContent = 'Добавить игру';
            document.getElementById('game-name-input').value = '';
            document.getElementById('game-status-input').value = 'completed';
            document.getElementById('rating-input').value = '5.0';
            document.getElementById('rating-value').textContent = '5.0';
            document.getElementById('review-input').value = '';
            updateReviewCount();
            document.getElementById('delete-game-btn').style.display = 'none';
            openModal('modal-game');
        });

        function saveEditor() {
            const title = document.getElementById('game-name-input').value.trim();
            if(!title) return;
            const status = document.getElementById('game-status-input').value;
            const rating = parseFloat(document.getElementById('rating-input').value);
            const review = document.getElementById('review-input').value.substring(0, 700);

            if(editingId) {
                const item = list.find(g => g.id === editingId);
                if(item) { item.title = title; item.status = status; item.rating = rating; item.review = review; }
            } else {
                list.push({ id: Date.now().toString(), title, status, rating, review, date: new Date().toLocaleDateString('ru-RU') });
            }
            closeModal('modal-game');
            saveListState();
        }

        function deleteCurrentGame() {
            if(!editingId) return;
            list = list.filter(g => g.id !== editingId);
            closeModal('modal-game');
            saveListState();
        }

        document.getElementById('search-input').addEventListener('input', renderList);
        document.getElementById('rating-input').addEventListener('input', e => { document.getElementById('rating-value').textContent = Number(e.target.value).toFixed(1); });
        document.getElementById('review-input').addEventListener('input', updateReviewCount);
        document.getElementById('save-game-btn').addEventListener('click', saveEditor);
        document.getElementById('delete-game-btn').addEventListener('click', deleteCurrentGame);
        
        document.getElementById('game-list').addEventListener('click', e => {
            const row = e.target.closest('[data-id]');
            if (!row) return;
            const item = list.find(game => game.id === row.dataset.id);
            if (!item) return;
            if (isAdmin()) openEditModal(item); else openViewModal(item);
        });

        document.querySelectorAll('[data-close]').forEach(btn => { btn.addEventListener('click', () => closeModal(btn.dataset.close)); });
        document.querySelectorAll('.modal').forEach(m => { m.addEventListener('click', e => { if (e.target === m) closeModal(m.id); }); });
        
        document.querySelectorAll('#stats-nav .filter-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#stats-nav .filter-chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderList();
            });
        });

        checkAdminSession();
        fetchList();
    </script>
</body>
</html>
