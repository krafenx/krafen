<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krafen / stream</title>
    <meta name="description" content="YouTube video queue as a synced stream">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/krafenx/krafen/8c5ff5d6ae7d406899fbf4906d5bc543e06c6648/cherry-blossom.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --card: rgba(13, 13, 13, 0.45);
            --accent: #5b2333;
            --accent-light: #f7f4f3;
            --accent-dark: #3a1420;
            --accent-gradient: linear-gradient(135deg, var(--accent-light), var(--accent));
            --accent-soft: linear-gradient(135deg, rgba(247, 244, 243, 0.10), rgba(91, 35, 51, 0.24));
            --border: rgba(255, 255, 255, 0.04);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            font-family: "JetBrains Mono", monospace;
            color: #e4e4e7;
            min-height: 100vh;
            width: 100%;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        .glass {
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 0.85rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass:hover {
            border-color: rgba(91, 35, 51, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(91, 35, 51, 0.1);
            transform: translateY(-1px);
        }

        .top-nav-link {
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .top-nav-link:hover {
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 0.4rem;
            color: #d4d4d8;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: rgba(91, 35, 51, 0.2);
            border-color: rgba(91, 35, 51, 0.5);
            color: #fff;
        }

        .btn-action:disabled {
            cursor: not-allowed;
            opacity: 0.35;
        }

        .stream-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(280px, 26rem);
            gap: 1rem;
            align-items: start;
        }

        .player-card {
            overflow: hidden;
        }

        .stream-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1rem 0.8rem;
        }

        .admin-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.45rem;
        }

        .player-shell {
            position: relative;
            overflow: hidden;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: #050505;
            aspect-ratio: 16 / 9;
        }

        #player,
        #player iframe {
            width: 100%;
            height: 100%;
            display: block;
        }

        .empty-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(135deg, rgba(91, 35, 51, 0.18), rgba(255, 255, 255, 0.025)),
                rgba(0, 0, 0, 0.36);
            color: rgba(255, 255, 255, 0.35);
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-align: center;
            padding: 1rem;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid rgba(91, 35, 51, 0.45);
            border-radius: 999px;
            background: rgba(91, 35, 51, 0.24);
            color: #f7d9e2;
            font-size: 0.55rem;
            letter-spacing: 0.18em;
            padding: 0.3rem 0.55rem;
            text-transform: uppercase;
        }

        .live-badge.on {
            border-color: rgba(22, 163, 74, 0.3);
            background: rgba(22, 163, 74, 0.16);
            color: #d5ffec;
        }

        .live-dot {
            width: 0.4rem;
            height: 0.4rem;
            border-radius: 999px;
            background: currentColor;
        }

        .timeline-bar {
            height: 3px;
            overflow: hidden;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.12);
        }

        .timeline-progress {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: rgba(255, 255, 255, 0.85);
            transition: width 1s linear;
        }

        .stream-meta-panel {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 1rem;
            align-items: end;
            padding: 0.9rem 1rem 1rem;
        }

        .now-label,
        .next-label {
            color: rgba(255, 255, 255, 0.32);
            font-size: 0.55rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .next-line {
            margin-top: 0.55rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.68rem;
            line-height: 1.4;
        }

        .queue-list {
            display: grid;
            gap: 0.55rem;
            max-height: 66vh;
            overflow: auto;
            padding-right: 0.1rem;
        }

        .queue-item {
            display: grid;
            grid-template-columns: 4.5rem minmax(0, 1fr);
            gap: 0.7rem;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.055);
            border-radius: 0.75rem;
            background:
                linear-gradient(90deg, rgba(247, 244, 243, 0.06), transparent 38%),
                rgba(255, 255, 255, 0.03);
            padding: 0.55rem;
            transition: all 0.2s ease;
        }

        .queue-item.active {
            border-color: rgba(91, 35, 51, 0.55);
            background:
                linear-gradient(90deg, rgba(91, 35, 51, 0.18), transparent 46%),
                rgba(255, 255, 255, 0.035);
        }

        .queue-thumb {
            width: 4.5rem;
            aspect-ratio: 16 / 9;
            border-radius: 0.45rem;
            border: 1px solid rgba(255, 255, 255, 0.07);
            object-fit: cover;
            background: rgba(255, 255, 255, 0.04);
        }

        .queue-title {
            color: #fff;
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .queue-meta {
            color: rgba(255, 255, 255, 0.38);
            font-size: 0.58rem;
            letter-spacing: 0.12em;
            margin-top: 0.25rem;
            text-transform: uppercase;
        }

        .queue-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-top: 0.5rem;
        }

        .tiny-btn {
            min-width: 1.55rem;
            height: 1.55rem;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 0.35rem;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            font: inherit;
            font-size: 0.58rem;
            transition: all 0.15s ease;
        }

        .tiny-btn:hover {
            border-color: rgba(91, 35, 51, 0.5);
            background: rgba(91, 35, 51, 0.16);
            color: #fff;
        }

        .kf-input {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 0.75rem;
            background: rgba(255, 255, 255, 0.035);
            color: #efefef;
            font: inherit;
            font-size: 12px;
            outline: none;
            padding: 0.75rem 1rem;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .kf-input::placeholder {
            color: rgba(255, 255, 255, 0.24);
        }

        .kf-input:focus {
            border-color: rgba(91, 35, 51, 0.65);
            background: rgba(255, 255, 255, 0.045);
        }

        .add-status {
            min-height: 1rem;
            color: rgba(255, 255, 255, 0.28);
            font-size: 0.58rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .probe-shell {
            position: fixed;
            left: -4px;
            bottom: -4px;
            width: 2px;
            height: 2px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .admin-only {
            display: none !important;
        }

        body.is-admin .admin-only {
            display: flex !important;
        }

        body.is-admin .admin-grid {
            display: grid !important;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(5, 5, 5, 0.82);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            width: min(420px, 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.85rem;
            background: rgba(10, 10, 12, 0.98);
            padding: 1.25rem;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.25rem;
            z-index: 200;
            transform: translateX(-50%) translateY(12px);
            opacity: 0;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
            background: rgba(12, 12, 12, 0.97);
            padding: 0.65rem 1rem;
            font-size: 11px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #starfield {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -2;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(91, 35, 51, 0.18), transparent 55%);
            pointer-events: none;
            z-index: -1;
        }

        .stars {
            position: absolute;
            inset: -100%;
        }

        .stars-small {
            background-image:
                radial-gradient(1px 1px at 40px 60px, #fff, transparent),
                radial-gradient(1px 1px at 120px 180px, #fff, transparent),
                radial-gradient(1px 1px at 220px 340px, #fff, transparent),
                radial-gradient(1px 1px at 460px 120px, #fff, transparent),
                radial-gradient(1px 1px at 700px 540px, #fff, transparent);
            background-size: 800px 800px;
            opacity: 0.45;
            animation: drift-small 240s linear infinite;
        }

        .stars-medium {
            background-image:
                radial-gradient(2px 2px at 100px 140px, #fff, transparent),
                radial-gradient(2px 2px at 350px 500px, #fff, transparent),
                radial-gradient(2px 2px at 700px 260px, #fff, transparent);
            background-size: 1000px 1000px;
            opacity: 0.35;
            animation: drift-medium 180s linear infinite;
        }

        .stars-large {
            background-image:
                radial-gradient(3px 3px at 250px 250px, #fff, transparent),
                radial-gradient(3px 3px at 900px 600px, #fff, transparent);
            background-size: 1200px 1200px;
            opacity: 0.25;
            animation: drift-large 120s linear infinite;
        }

        @keyframes drift-small {
            from { transform: translateY(0); }
            to { transform: translateY(800px); }
        }

        @keyframes drift-medium {
            from { transform: translateY(0); }
            to { transform: translateY(1000px); }
        }

        @keyframes drift-large {
            from { transform: translateY(0); }
            to { transform: translateY(1200px); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(91, 35, 51, 0.4); border-radius: 2px; }

        @media (max-width: 980px) {
            .stream-layout {
                grid-template-columns: minmax(0, 1fr);
            }

            .queue-list {
                max-height: none;
            }
        }

        @media (max-width: 640px) {
            .stream-head,
            .stream-meta-panel {
                grid-template-columns: minmax(0, 1fr);
                display: grid;
            }

            .admin-controls {
                justify-content: flex-start;
            }

            .queue-item {
                grid-template-columns: 5rem minmax(0, 1fr);
            }

            .queue-thumb {
                width: 5rem;
            }
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-10 flex flex-col items-center">
    <div id="starfield">
        <div class="stars stars-small"></div>
        <div class="stars stars-medium"></div>
        <div class="stars stars-large"></div>
    </div>

    <div class="w-full max-w-[1440px] flex flex-col">
        <nav class="w-full flex items-center justify-between mb-5 px-1" aria-label="site sections">
            <a class="top-nav-link" href="/">&larr; home</a>
            <button id="lock-btn" class="top-nav-link bg-transparent border-0 cursor-pointer" type="button">admin</button>
        </nav>

        <main class="stream-layout">
            <section class="glass player-card">
                <div class="stream-head">
                    <div class="min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            <span id="live-badge" class="live-badge"><span class="live-dot"></span><span id="live-label">offline</span></span>
                            <span id="sync-label" class="text-[9px] uppercase tracking-[0.18em] text-white/25">syncing</span>
                        </div>
                        <div class="now-label">now playing</div>
                        <h1 id="current-title" class="text-2xl sm:text-3xl font-bold tracking-tight text-white truncate mt-1">youtube stream</h1>
                    </div>
                    <div class="admin-only admin-controls">
                        <button id="prev-btn" class="btn-action px-3 py-2 text-[9px] uppercase tracking-wider" type="button">prev</button>
                        <button id="play-btn" class="btn-action px-3 py-2 text-[9px] uppercase tracking-wider" type="button">pause</button>
                        <button id="restart-btn" class="btn-action px-3 py-2 text-[9px] uppercase tracking-wider" type="button">restart</button>
                        <button id="next-btn" class="btn-action px-3 py-2 text-[9px] uppercase tracking-wider" type="button">next</button>
                    </div>
                </div>

                <div class="player-shell">
                    <div id="player"></div>
                    <div id="empty-overlay" class="empty-overlay">no queue</div>
                </div>

                <div class="stream-meta-panel">
                    <div class="min-w-0">
                        <div class="flex items-center justify-between gap-3 mb-2">
                            <span id="time-current" class="text-[10px] text-white/35">00:00</span>
                            <span id="cycle-time" class="text-[10px] uppercase tracking-[0.16em] text-white/25">queue 00:00</span>
                            <span id="time-total" class="text-[10px] text-white/35">00:00</span>
                        </div>
                        <div class="timeline-bar"><div id="timeline-progress" class="timeline-progress"></div></div>
                        <div class="next-line"><span class="next-label">up next</span> <span id="up-next-title">nothing</span></div>
                    </div>
                </div>
            </section>

            <aside class="glass p-3 sm:p-4">
                <div class="flex items-center justify-between gap-3 mb-3">
                    <div>
                        <div class="text-[10px] uppercase tracking-[0.2em] text-white/30">youtube</div>
                        <h2 class="text-xl font-bold tracking-tight text-white">queue</h2>
                    </div>
                    <button id="add-open-btn" class="btn-action admin-only px-3 py-2 text-[9px] uppercase tracking-wider" type="button">add</button>
                </div>
                <div id="queue-list" class="queue-list"></div>
            </aside>

            <section class="glass admin-only admin-grid p-3 sm:p-4" style="display:none;">
                <form id="add-form" class="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_auto] gap-2 w-full">
                    <input id="video-url-input" class="kf-input" type="text" placeholder="youtube url or id" autocomplete="off">
                    <button id="add-submit-btn" class="btn-action px-4 py-2 text-[10px] uppercase tracking-[0.18em]" type="submit">add</button>
                    <div id="add-status" class="add-status md:col-span-2"></div>
                </form>
            </section>
        </main>
    </div>

    <div class="probe-shell" aria-hidden="true">
        <div id="duration-probe"></div>
    </div>

    <div class="modal-overlay" id="modal-admin">
        <div class="modal-box">
            <div class="flex items-start justify-between gap-4 mb-4">
                <div>
                    <div class="text-[10px] uppercase tracking-[0.22em] opacity-35">admin</div>
                    <h2 class="text-2xl font-bold tracking-tight text-white mt-1">login</h2>
                </div>
                <button id="admin-close-btn" class="btn-action px-3 py-2 text-[9px] uppercase tracking-wider" type="button">x</button>
            </div>
            <input id="admin-password-input" class="kf-input" type="password" placeholder="password">
            <div id="admin-login-error" class="hidden mt-3 text-[10px] leading-5 text-red-400/75 border border-red-500/20 bg-red-500/5 rounded-md px-3 py-2">login failed</div>
            <button id="login-btn" class="btn-action w-full px-4 py-2.5 text-[10px] uppercase tracking-[0.18em] mt-4" type="button">enter</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API = {
            stream: '/api/stream',
            admin: '/api/admin',
        };

        const els = {
            liveBadge: document.getElementById('live-badge'),
            liveLabel: document.getElementById('live-label'),
            syncLabel: document.getElementById('sync-label'),
            currentTitle: document.getElementById('current-title'),
            emptyOverlay: document.getElementById('empty-overlay'),
            timeCurrent: document.getElementById('time-current'),
            timeTotal: document.getElementById('time-total'),
            cycleTime: document.getElementById('cycle-time'),
            upNextTitle: document.getElementById('up-next-title'),
            progress: document.getElementById('timeline-progress'),
            queueList: document.getElementById('queue-list'),
            lockBtn: document.getElementById('lock-btn'),
            modalAdmin: document.getElementById('modal-admin'),
            adminPassword: document.getElementById('admin-password-input'),
            adminError: document.getElementById('admin-login-error'),
            loginBtn: document.getElementById('login-btn'),
            addForm: document.getElementById('add-form'),
            videoUrl: document.getElementById('video-url-input'),
            addSubmit: document.getElementById('add-submit-btn'),
            addStatus: document.getElementById('add-status'),
            addOpenBtn: document.getElementById('add-open-btn'),
            prevBtn: document.getElementById('prev-btn'),
            playBtn: document.getElementById('play-btn'),
            restartBtn: document.getElementById('restart-btn'),
            nextBtn: document.getElementById('next-btn'),
            toast: document.getElementById('toast'),
        };

        let state = {
            queue: [],
            startedAt: Date.now(),
            pausedAt: null,
            updatedAt: Date.now(),
        };
        let serverOffset = 0;
        let player = null;
        let probePlayer = null;
        let playerReady = false;
        let probeReady = false;
        let probeReadyResolve = null;
        let probeJob = Promise.resolve();
        let activeVideoId = '';
        let toastTimer = null;
        let durationSaveTimer = null;
        let lastFetchAt = 0;

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;',
            })[char]);
        }

        function serverNow() {
            return Date.now() + serverOffset;
        }

        function activeNow() {
            return state.pausedAt !== null ? state.pausedAt : serverNow();
        }

        function formatTime(seconds) {
            const safe = Math.max(0, Math.floor(seconds || 0));
            const hrs = Math.floor(safe / 3600);
            const mins = Math.floor((safe % 3600) / 60);
            const secs = safe % 60;
            if (hrs > 0) {
                return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function totalDuration() {
            return state.queue.reduce((sum, item) => sum + Number(item.durationSeconds || 0), 0);
        }

        function cumulativeStart(index) {
            return state.queue.slice(0, index).reduce((sum, item) => sum + Number(item.durationSeconds || 0), 0);
        }

        function getPosition() {
            const total = totalDuration();
            if (!state.queue.length || total <= 0) return null;

            const elapsed = Math.max(0, Math.floor((activeNow() - state.startedAt) / 1000));
            const cycleElapsed = elapsed % total;
            let cursor = 0;

            for (let index = 0; index < state.queue.length; index += 1) {
                const item = state.queue[index];
                const duration = Number(item.durationSeconds || 0);
                if (cycleElapsed < cursor + duration) {
                    return {
                        index,
                        item,
                        offset: cycleElapsed - cursor,
                        duration,
                        cycleElapsed,
                        total,
                    };
                }
                cursor += duration;
            }

            return {
                index: 0,
                item: state.queue[0],
                offset: 0,
                duration: state.queue[0].durationSeconds,
                cycleElapsed: 0,
                total,
            };
        }

        function parseYouTubeId(value) {
            const raw = String(value || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;

            try {
                const url = new URL(raw);
                const host = url.hostname.replace(/^www\./, '');

                if (host === 'youtu.be') {
                    const id = url.pathname.split('/').filter(Boolean)[0];
                    return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : '';
                }

                if (host.endsWith('youtube.com')) {
                    const fromQuery = url.searchParams.get('v');
                    if (/^[A-Za-z0-9_-]{11}$/.test(fromQuery || '')) return fromQuery;

                    const parts = url.pathname.split('/').filter(Boolean);
                    const marker = ['embed', 'shorts', 'live'].find(part => parts.includes(part));
                    if (marker) {
                        const id = parts[parts.indexOf(marker) + 1];
                        return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : '';
                    }
                }
            } catch {
                return '';
            }

            return '';
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function fetchVideoTitle(videoId) {
            const watchUrl = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
            const url = `https://www.youtube.com/oembed?url=${encodeURIComponent(watchUrl)}&format=json`;
            const res = await fetch(url, { cache: 'no-store' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.title) return '';
            return String(data.title).trim().slice(0, 160);
        }

        function waitForProbeReady() {
            if (probeReady && probePlayer) return Promise.resolve();
            return new Promise(resolve => {
                const previousResolve = probeReadyResolve;
                probeReadyResolve = () => {
                    previousResolve?.();
                    resolve();
                };
                setTimeout(resolve, 5000);
            });
        }

        function probeVideoDuration(videoId) {
            probeJob = probeJob.then(() => probeVideoDurationNow(videoId)).catch(() => 600);
            return probeJob;
        }

        async function probeVideoDurationNow(videoId) {
            await waitForProbeReady();
            if (!probePlayer) return 600;

            return new Promise(resolve => {
                let attempts = 0;
                let finished = false;
                let timer = null;

                function finish(value) {
                    if (finished) return;
                    finished = true;
                    if (timer) clearInterval(timer);
                    try { probePlayer.pauseVideo(); } catch {}
                    resolve(value);
                }

                try {
                    probePlayer.mute();
                    probePlayer.cueVideoById({ videoId });
                } catch {
                    finish(600);
                    return;
                }

                timer = setInterval(() => {
                    attempts += 1;
                    const duration = Math.round(Number(probePlayer.getDuration?.() || 0));
                    if (Number.isFinite(duration) && duration >= 10 && duration <= 21_600) {
                        finish(duration);
                        return;
                    }

                    if (attempts === 10) {
                        try {
                            probePlayer.loadVideoById({ videoId, startSeconds: 0 });
                            probePlayer.mute();
                        } catch {}
                    }

                    if (attempts >= 28) finish(600);
                }, 250);
            });
        }

        async function getVideoDetails(videoId) {
            els.addStatus.textContent = 'loading metadata';
            const [titleResult, durationResult] = await Promise.allSettled([
                fetchVideoTitle(videoId),
                probeVideoDuration(videoId),
            ]);

            const title = titleResult.status === 'fulfilled' && titleResult.value
                ? titleResult.value
                : `youtube:${videoId}`;
            const durationSeconds = durationResult.status === 'fulfilled' && Number(durationResult.value) >= 10
                ? Number(durationResult.value)
                : 600;

            return { title, durationSeconds };
        }

        function showToast(message) {
            els.toast.textContent = message;
            els.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2200);
        }

        function applyServerState(data) {
            const parsedPausedAt = Number(data.pausedAt);
            state = {
                queue: Array.isArray(data.queue) ? data.queue : [],
                startedAt: Number(data.startedAt) || Date.now(),
                pausedAt: data.pausedAt === null || data.pausedAt === undefined || data.pausedAt === ''
                    ? null
                    : Number.isFinite(parsedPausedAt) && parsedPausedAt > 0
                        ? parsedPausedAt
                        : null,
                updatedAt: Number(data.updatedAt) || Date.now(),
            };

            if (Number.isFinite(Number(data.serverTime))) {
                serverOffset = Number(data.serverTime) - Date.now();
            }

            render();
            syncPlayer(true);
        }

        async function loadState() {
            try {
                const res = await fetch(API.stream, { cache: 'no-store' });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || 'stream_unavailable');
                lastFetchAt = Date.now();
                els.syncLabel.textContent = 'synced';
                applyServerState(data);
            } catch (error) {
                els.syncLabel.textContent = 'api unavailable';
                showToast(error.message || 'api unavailable');
                render();
            }
        }

        async function saveState() {
            try {
                const res = await fetch(API.stream, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(state),
                });
                const data = await res.json().catch(() => ({}));
                if (res.status === 401) {
                    openAdminModal();
                    throw new Error('login required');
                }
                if (!res.ok) throw new Error(data.error || 'save failed');
                applyServerState(data);
                showToast('saved');
            } catch (error) {
                showToast(error.message || 'save failed');
            }
        }

        async function checkAdmin() {
            try {
                const res = await fetch(API.admin, { credentials: 'include', cache: 'no-store' });
                const data = await res.json().catch(() => ({}));
                setAdmin(Boolean(data.ok));
            } catch {
                setAdmin(false);
            }
        }

        function setAdmin(on) {
            document.body.classList.toggle('is-admin', on);
            els.lockBtn.textContent = on ? 'admin:on' : 'admin';
            els.lockBtn.title = on ? 'admin active' : 'admin';
            render();
        }

        function openAdminModal() {
            els.adminError.classList.add('hidden');
            els.adminPassword.value = '';
            els.modalAdmin.classList.add('open');
            setTimeout(() => els.adminPassword.focus(), 50);
        }

        function closeAdminModal() {
            els.modalAdmin.classList.remove('open');
        }

        async function submitAdminLogin() {
            els.adminError.classList.add('hidden');
            try {
                const res = await fetch(API.admin, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ password: els.adminPassword.value }),
                });
                if (!res.ok) throw new Error('login failed');
                closeAdminModal();
                await checkAdmin();
                showToast('admin enabled');
            } catch {
                els.adminError.classList.remove('hidden');
            }
        }

        function render() {
            const pos = getPosition();
            const isLive = Boolean(pos && !state.pausedAt);
            els.liveBadge.classList.toggle('on', isLive);
            els.liveLabel.textContent = pos ? (state.pausedAt ? 'paused' : 'live') : 'offline';
            els.emptyOverlay.style.display = pos ? 'none' : 'flex';
            els.currentTitle.textContent = pos ? pos.item.title : 'youtube stream';
            els.timeCurrent.textContent = pos ? formatTime(pos.offset) : '00:00';
            els.timeTotal.textContent = pos ? formatTime(pos.duration) : '00:00';
            els.cycleTime.textContent = `queue ${formatTime(pos ? pos.total : 0)}`;
            els.progress.style.width = pos ? `${Math.min(100, (pos.offset / Math.max(1, pos.duration)) * 100)}%` : '0%';
            els.upNextTitle.textContent = getUpNextTitle(pos);
            els.playBtn.textContent = state.pausedAt ? 'resume' : 'pause';
            renderQueue(pos);
        }

        function getUpNextTitle(pos) {
            if (!pos || state.queue.length < 2) return 'nothing';
            const next = state.queue[(pos.index + 1) % state.queue.length];
            return next?.title || 'nothing';
        }

        function renderQueue(pos) {
            if (!state.queue.length) {
                els.queueList.innerHTML = '<div class="text-[10px] uppercase tracking-[0.18em] text-white/25 text-center py-12">queue empty</div>';
                return;
            }

            const isAdmin = document.body.classList.contains('is-admin');
            els.queueList.innerHTML = state.queue.map((item, index) => {
                const active = pos && pos.index === index;
                return `
                    <div class="queue-item ${active ? 'active' : ''}">
                        <img class="queue-thumb" src="https://i.ytimg.com/vi/${escapeHTML(item.videoId)}/mqdefault.jpg" alt="">
                        <div class="min-w-0">
                            <div class="queue-title">${escapeHTML(item.title)}</div>
                            <div class="queue-meta">${formatTime(item.durationSeconds)} · ${escapeHTML(item.videoId)}</div>
                            ${isAdmin ? `
                                <div class="queue-actions">
                                    <button class="tiny-btn" type="button" data-action="play" data-index="${index}" title="play now">now</button>
                                    <button class="tiny-btn" type="button" data-action="up" data-index="${index}" title="up">up</button>
                                    <button class="tiny-btn" type="button" data-action="down" data-index="${index}" title="down">dn</button>
                                    <button class="tiny-btn" type="button" data-action="remove" data-index="${index}" title="remove">x</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function syncPlayer(force = false) {
            const pos = getPosition();
            if (!playerReady || !player) return;

            if (!pos) {
                activeVideoId = '';
                try { player.stopVideo(); } catch {}
                return;
            }

            if (activeVideoId !== pos.item.videoId) {
                activeVideoId = pos.item.videoId;
                player.loadVideoById({ videoId: pos.item.videoId, startSeconds: Math.max(0, pos.offset) });
                try { player.mute(); } catch {}
                setTimeout(() => refreshActiveMetadata(true), 1200);
            } else {
                const current = Number(player.getCurrentTime?.() || 0);
                if (force || Math.abs(current - pos.offset) > 3) {
                    player.seekTo(Math.max(0, pos.offset), true);
                }
            }

            try {
                if (state.pausedAt) player.pauseVideo();
                else player.playVideo();
            } catch {}
        }

        function refreshActiveMetadata(allowSave = false) {
            if (!playerReady || !player) return false;

            const pos = getPosition();
            if (!pos) return false;

            let changed = false;
            const videoData = player.getVideoData?.() || {};
            const title = String(videoData.title || '').trim().slice(0, 160);
            const duration = Math.round(Number(player.getDuration?.() || 0));
            const nextItem = { ...pos.item };

            if (title && title !== nextItem.title) {
                nextItem.title = title;
                changed = true;
            }

            if (Number.isFinite(duration)
                && duration >= 10
                && duration <= 21_600
                && Math.abs(duration - Number(nextItem.durationSeconds || 0)) > 1) {
                nextItem.durationSeconds = duration;
                changed = true;
            }

            if (!changed) return false;

            state.queue[pos.index] = nextItem;
            render();

            if (allowSave && document.body.classList.contains('is-admin')) {
                clearTimeout(durationSaveTimer);
                durationSaveTimer = setTimeout(saveState, 1200);
            }

            return true;
        }

        function shiftToIndex(index) {
            if (!state.queue.length) return;
            const safeIndex = ((index % state.queue.length) + state.queue.length) % state.queue.length;
            state.startedAt = serverNow() - cumulativeStart(safeIndex) * 1000;
            state.pausedAt = null;
            saveState();
        }

        function pauseOrResume() {
            if (!state.queue.length) return;
            if (state.pausedAt) {
                const pausedFor = serverNow() - state.pausedAt;
                state.startedAt += pausedFor;
                state.pausedAt = null;
            } else {
                state.pausedAt = serverNow();
            }
            saveState();
        }

        function restartStream() {
            state.startedAt = serverNow();
            state.pausedAt = null;
            saveState();
        }

        async function addVideo(event) {
            event.preventDefault();
            const videoId = parseYouTubeId(els.videoUrl.value);
            if (!videoId) {
                showToast('invalid youtube url');
                return;
            }

            els.addSubmit.disabled = true;
            els.addSubmit.textContent = 'loading';

            let details;
            try {
                details = await getVideoDetails(videoId);
            } catch {
                details = { title: `youtube:${videoId}`, durationSeconds: 600 };
            }

            const wasEmpty = state.queue.length === 0;
            state.queue.push({
                id: `${videoId}_${Date.now()}`,
                videoId,
                title: details.title,
                durationSeconds: details.durationSeconds,
                addedAt: Date.now(),
            });

            if (wasEmpty) {
                state.startedAt = serverNow();
                state.pausedAt = null;
            }

            els.addForm.reset();
            els.addStatus.textContent = '';
            els.addSubmit.disabled = false;
            els.addSubmit.textContent = 'add';
            await saveState();
        }

        function handleQueueAction(event) {
            const btn = event.target.closest('[data-action]');
            if (!btn || !document.body.classList.contains('is-admin')) return;

            const index = Number(btn.dataset.index);
            const action = btn.dataset.action;
            if (!Number.isInteger(index) || !state.queue[index]) return;

            if (action === 'play') {
                shiftToIndex(index);
                return;
            }

            if (action === 'remove') {
                state.queue.splice(index, 1);
                state.startedAt = serverNow();
                state.pausedAt = null;
                saveState();
                return;
            }

            if (action === 'up' && index > 0) {
                [state.queue[index - 1], state.queue[index]] = [state.queue[index], state.queue[index - 1]];
                saveState();
                return;
            }

            if (action === 'down' && index < state.queue.length - 1) {
                [state.queue[index + 1], state.queue[index]] = [state.queue[index], state.queue[index + 1]];
                saveState();
            }
        }

        function createYouTubePlayer() {
            if (!window.YT || !window.YT.Player) return;

            if (!player) {
                player = new YT.Player('player', {
                    playerVars: {
                        autoplay: 1,
                        controls: 1,
                        rel: 0,
                        modestbranding: 1,
                        playsinline: 1,
                    },
                    events: {
                        onReady: () => {
                            playerReady = true;
                            try { player.mute(); } catch {}
                            syncPlayer(true);
                        },
                        onStateChange: event => {
                            if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.CUED) {
                                setTimeout(() => refreshActiveMetadata(true), 600);
                            }

                            if (event.data === YT.PlayerState.ENDED) {
                                refreshActiveMetadata(true);
                                syncPlayer(true);
                            }
                        },
                    },
                });
            }

            if (!probePlayer) {
                probePlayer = new YT.Player('duration-probe', {
                    width: '2',
                    height: '2',
                    playerVars: {
                        autoplay: 0,
                        controls: 0,
                        disablekb: 1,
                        playsinline: 1,
                        rel: 0,
                    },
                    events: {
                        onReady: () => {
                            probeReady = true;
                            probeReadyResolve?.();
                            probeReadyResolve = null;
                            try { probePlayer.mute(); } catch {}
                        },
                    },
                });
            }
        }

        window.onYouTubeIframeAPIReady = createYouTubePlayer;

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) {
                createYouTubePlayer();
                return;
            }

            const script = document.createElement('script');
            script.src = 'https://www.youtube.com/iframe_api';
            script.async = true;
            document.head.appendChild(script);
        }

        els.lockBtn.addEventListener('click', () => {
            if (document.body.classList.contains('is-admin')) return;
            openAdminModal();
        });
        document.getElementById('admin-close-btn').addEventListener('click', closeAdminModal);
        els.modalAdmin.addEventListener('click', event => {
            if (event.target === els.modalAdmin) closeAdminModal();
        });
        els.loginBtn.addEventListener('click', submitAdminLogin);
        els.adminPassword.addEventListener('keydown', event => {
            if (event.key === 'Enter') submitAdminLogin();
        });
        els.addForm.addEventListener('submit', addVideo);
        els.addOpenBtn.addEventListener('click', () => els.videoUrl.focus());
        els.queueList.addEventListener('click', handleQueueAction);
        els.playBtn.addEventListener('click', pauseOrResume);
        els.restartBtn.addEventListener('click', restartStream);
        els.nextBtn.addEventListener('click', () => {
            const pos = getPosition();
            shiftToIndex(pos ? pos.index + 1 : 0);
        });
        els.prevBtn.addEventListener('click', () => {
            const pos = getPosition();
            shiftToIndex(pos ? pos.index - 1 : 0);
        });

        setInterval(() => {
            render();
            syncPlayer(false);
            if (Date.now() - lastFetchAt > 20_000 && !document.body.classList.contains('is-admin')) {
                loadState();
            }
        }, 1000);

        checkAdmin();
        loadState();
        loadYouTubeApi();
    </script>
</body>
</html>
